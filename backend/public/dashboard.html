<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard</title>
  <style>
    body { font-family: sans-serif; margin:0; background:#f3f4f6; }
    header { background:#1e293b; color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
    button { background:#ef4444; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; }
    main { padding:24px; }
  </style>
</head>
<body>
  <header>
    <h3>Admin Dashboard</h3>
    <div><span id="who"></span> &nbsp; <button onclick="logout()">Logout</button></div>
  </header>
  <main>
    <h2>Welcome Admin 👋</h2>
    <p>Yahan se aap apna dashboard build karna shuru kar sakte hain.</p>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = 'login.html';

    fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then((d) => (document.getElementById('who').textContent = d.phone))
      .catch(logout);

    function logout() {
      localStorage.removeItem('token');
      location.href = 'login.html';
    }
  </script>
</body>
</html>
