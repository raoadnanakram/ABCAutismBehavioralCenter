<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;color:#fff;overflow:hidden;background:linear-gradient(130deg,#0f0c29,#302b63,#24243e,#0f766e);background-size:400% 400%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
.o{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;animation:f 9s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#7c3aed;top:-80px;left:-60px}.o2{width:260px;height:260px;background:#06b6d4;bottom:-60px;right:-40px;animation-delay:-4s}
@keyframes f{to{transform:translate(60px,40px) scale(1.2)}}
form{position:relative;width:min(380px,92vw);padding:40px 32px;border-radius:24px;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.4);animation:in .8s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.9)}}
h1{text-align:center;margin-bottom:6px}p{text-align:center;opacity:.7;margin-bottom:26px;font-size:14px}
input{width:100%;padding:14px 16px;margin-bottom:16px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;outline:0;transition:.3s}
input::placeholder{color:#cbd5e1}input:hover,input:focus{border-color:#22d3ee;box-shadow:0 0 0 4px rgba(34,211,238,.2);transform:translateY(-2px)}
button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#7c3aed,#06b6d4);transition:.3s}
button:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(6,182,212,.5)}button:disabled{opacity:.6}
#m{color:#fda4af;text-align:center;margin-top:12px;min-height:20px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div class="o o1"></div><div class="o o2"></div>
<form id="f"><h1>🔐 Admin Login</h1><p>Sign in to manage messages and appointments</p>
<input id="p" placeholder="Phone number" inputmode="numeric" required autocomplete="username">
<input id="w" type="password" placeholder="Password" required autocomplete="current-password">
<button id="b">Sign in</button><div id="m"></div></form>
<script>
f.onsubmit=async ev=>{ev.preventDefault();b.disabled=true;m.textContent='';
const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p.value,password:w.value})}).catch(()=>null);
if(r&&r.ok)return location='dashboard.html';
const j=r?await r.json().catch(()=>({})):{};m.textContent=j.error||'Network error';b.disabled=false;
f.animate([{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'none'}],{duration:250,iterations:2})};
</script>
